# Nightly corpus refresh and sweep, run INSIDE the live Fly machine so they see
# /data and the same index the site answers from. GitHub is only the alarm
# clock. `fly machine exec` goes through Fly's API (no SSH tunnel needed from
# a GitHub runner). Needs one repository secret: FLY_API_TOKEN
# (fly tokens create deploy -x 999999h).
name: corpus refresh
on:
  schedule:
    - cron: "17 9 * * *"        # 09:17 UTC daily = 5:17 am Eastern
  workflow_dispatch: {}         # "Run workflow" button for a manual check
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: find the app machine
        id: machine
        run: |
          ID=$(flyctl machines list -a trailheadrx --json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: wake it if suspended
        run: flyctl machine start ${{ steps.machine.outputs.id }} -a trailheadrx || true
      - name: run the refresh on the app machine
        run: flyctl machine exec ${{ steps.machine.outputs.id }} "python -m trailheadrx refresh" -a trailheadrx --timeout 600
      # A machine exec may not run longer than 600 s, and a sweep can. So the
      # sweep is started in the background on the machine; this job then keeps
      # the machine awake (a request every 30 s stops it suspending) and waits
      # for the done-marker, then prints the report. The sweep emails on its own.
      - name: start the sweep in the background (budget-capped in config.yaml)
        run: >
          flyctl machine exec ${{ steps.machine.outputs.id }} -a trailheadrx --timeout 60
          "sh -c 'rm -f /data/sweep.done; nohup sh -c \"python -m trailheadrx sweep --pairs 12; touch /data/sweep.done\" > /data/sweep.log 2>&1 &'"
      - name: wait for it, keeping the machine awake
        run: |
          for i in $(seq 1 150); do
            curl -s -o /dev/null https://trailheadrx.com/health || true
            if flyctl machine exec ${{ steps.machine.outputs.id }} -a trailheadrx --timeout 30 "test -f /data/sweep.done" >/dev/null 2>&1; then
              echo "sweep finished after ~$((i*30)) s"; break
            fi
            sleep 30
          done
      - name: sweep report
        run: flyctl machine exec ${{ steps.machine.outputs.id }} -a trailheadrx --timeout 30 "cat /data/sweep.log"
