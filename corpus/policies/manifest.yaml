_meta:
  description: >
    Ring-one policy corpus for migraine. One entry per governing document.
    Documents are downloaded by hand into this folder and are NOT committed
    (public repo, payer terms of use). URLs and dates below were located on
    2026-09-12; verify each when downloading and fill in `file` and
    `downloaded_on`. `st_note` is a working summary of the step therapy rule
    as read from the document or its landing page; the app cites the
    document, never this note.
  ring: 1
  category: migraine
  state: OH
  located_on: "2026-09-12"

# Field guide
#   payer            Plan or PBM whose criteria govern
#   line_of_business commercial | medicaid_mco | medicare_advantage | medicaid_ffs | reference
#   benefit_type     pharmacy | medical | n/a
#   scope            drugs/classes covered
#   title, policy_id, url, effective_or_reviewed  — from the document
#   st_note          working summary of the step therapy / criteria (not authoritative)
#   file, downloaded_on  — fill in when downloaded
#   status           found | landing_only | not_public

