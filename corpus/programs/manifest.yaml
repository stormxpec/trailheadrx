_meta:
  description: >
    Manufacturer and access programs for migraine medicines, as read on the
    maker's own pages. Every record carries the URL it came from and the date
    it was read (verified_on). Program terms change often — the freshness
    rule (G6) flags anything older than the threshold. "not_found" means the
    page did not state it; never guess. Facts here are rendered by code into
    the "other ways to get it" section; the model does not write that section.
  verified_on: "2026-09-13"
  fpl_note: >
    Income ceilings are given as a percent of the Federal Poverty Level (FPL)
    where the maker states one. 300% FPL for a household of 1 is roughly
    $47k/yr in 2026; of 4 roughly $96k/yr. Check the program's own table.

