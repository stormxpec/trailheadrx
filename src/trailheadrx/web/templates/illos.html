{# Original flat illustrations, drawn inline so the page stays self-contained. #}
{% macro person_at_laptop(size=260) %}
<svg class="illo" width="{{ size }}" height="{{ (size * 0.78)|int }}" viewBox="0 0 320 250" role="img" aria-label="A person at a desk, working out their health plan's rules">
  <!-- soft blob background -->
  <path d="M60 40 C110 -10 230 10 280 50 C330 90 310 170 270 210 C230 250 120 250 70 215 C20 180 10 90 60 40 Z" fill="#dff0ea"/>
  <!-- floor shadow -->
  <ellipse cx="165" cy="236" rx="120" ry="7" fill="#c9ddd6"/>
  <!-- chair -->
  <rect x="205" y="120" width="44" height="60" rx="14" fill="#1f6f5f"/>
  <rect x="198" y="168" width="60" height="16" rx="8" fill="#2a8a76"/>
  <rect x="224" y="184" width="8" height="30" fill="#4a5a57"/>
  <path d="M200 226 L228 214 L256 226" fill="none" stroke="#4a5a57" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="228" r="5" fill="#4a5a57"/><circle cx="256" cy="228" r="5" fill="#4a5a57"/><circle cx="228" cy="230" r="5" fill="#4a5a57"/>
  <!-- desk -->
  <rect x="40" y="150" width="170" height="12" rx="3" fill="#3c4a47"/>
  <rect x="52" y="162" width="9" height="66" fill="#3c4a47"/>
  <rect x="186" y="162" width="9" height="66" fill="#3c4a47"/>
  <!-- paperwork pile -->
  <rect x="58" y="132" width="42" height="18" rx="2" fill="#ffffff" stroke="#c9ddd6" stroke-width="2"/>
  <rect x="62" y="126" width="42" height="18" rx="2" fill="#fff6d6" stroke="#e3cf8a" stroke-width="2"/>
  <path d="M68 133 h28 M68 138 h20" stroke="#c9b45c" stroke-width="2" stroke-linecap="round"/>
  <!-- mug -->
  <rect x="112" y="134" width="16" height="16" rx="3" fill="#e0785a"/>
  <path d="M128 138 q8 0 8 6 t-8 6" fill="none" stroke="#e0785a" stroke-width="3"/>
  <path d="M118 128 q3-4 0-8 M123 128 q3-4 0-8" stroke="#b9cdc7" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- laptop -->
  <path d="M136 150 L142 100 Q143 96 147 96 H208 Q212 96 211 100 L205 150 Z" fill="#2f3f3b"/>
  <path d="M141 145 L146 102 H206 L201 145 Z" fill="#eaf5f1"/>
  <path d="M154 112 h36 M153 120 h30 M152 128 h22" stroke="#1f6f5f" stroke-width="3" stroke-linecap="round"/>
  <path d="M182 128 l5 5 l9-11" fill="none" stroke="#e0785a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- person: legs, body, arms, head -->
  <path d="M212 180 q-10 10-30 8 l-26 0 q-8 0-8 8 l0 28 h12 l2-24 h22 l-6 24 h13 l8-30 q6-14 13-14z" fill="#243b52"/>
  <path d="M148 228 h20 v6 h-22z M186 228 h20 v6 h-22z" fill="#e0785a"/>
  <path d="M200 110 q22 0 24 22 l4 48 h-40 l-6-46 q-2-24 18-24z" fill="#f2b84b"/>
  <!-- arm on desk / hand on chin -->
  <path d="M190 132 q-20 6-30 14 q-6 4-2 8 q4 4 10 0 q10-8 26-10z" fill="#f2b84b"/>
  <path d="M158 150 q-6-6-4-12 q2-4 6-2 q4 8 4 14z" fill="#f2c9a8"/>
  <path d="M210 130 q-14 2-14 14 q0 6 6 6 q6-2 8-12z" fill="#f2b84b"/>
  <circle cx="200" cy="96" r="18" fill="#f2c9a8"/>
  <path d="M182 96 q-2-24 20-24 q20 0 18 22 q-4-10-14-10 q-8 0-12 6 q-4 4-6 12 q-4-2-6-6z" fill="#2c1e1a"/>
  <path d="M214 92 q6 10 4 22 q-2 8-6 10 q2-14-2-26z" fill="#2c1e1a"/>
  <circle cx="192" cy="98" r="1.8" fill="#2c1e1a"/>
  <path d="M188 106 q4 3 8 0" fill="none" stroke="#2c1e1a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- thought: a small route appearing -->
  <path d="M236 70 q10-12 24-4 t22-2" fill="none" stroke="#1f6f5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <circle cx="284" cy="62" r="5" fill="#e0785a"/>
</svg>
{% endmacro %}

{% macro doctor(size=180) %}
<svg class="illo" width="{{ size }}" height="{{ (size * 0.9)|int }}" viewBox="0 0 200 180" role="img" aria-label="A doctor with a clipboard">
  <path d="M40 30 C70 -5 150 5 175 40 C200 75 190 135 160 160 C130 185 60 180 35 150 C10 120 10 60 40 30 Z" fill="#dff0ea"/>
  <ellipse cx="100" cy="170" rx="60" ry="5" fill="#c9ddd6"/>
  <!-- legs -->
  <path d="M82 118 h14 l-2 46 h-12z M104 118 h14 l0 46 h-12z" fill="#243b52"/>
  <path d="M78 160 h20 v6 h-22z M102 160 h20 v6 h-22z" fill="#2c1e1a"/>
  <!-- coat -->
  <path d="M70 70 q0-12 12-12 h36 q12 0 12 12 v50 h-60z" fill="#ffffff" stroke="#c9ddd6" stroke-width="2"/>
  <path d="M100 58 l-8 14 l8 40 l8-40z" fill="#1f6f5f"/>
  <!-- stethoscope -->
  <path d="M86 62 q-6 14 0 26 q4 8 10 10" fill="none" stroke="#1f6f5f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="98" cy="100" r="5" fill="#1f6f5f"/>
  <!-- arm + clipboard -->
  <path d="M130 74 q14 6 14 22 l-4 20 q-2 6-8 4 q-4-2-3-8 l3-18 q0-8-8-12z" fill="#ffffff" stroke="#c9ddd6" stroke-width="2"/>
  <rect x="122" y="94" width="30" height="40" rx="3" fill="#fff6d6" stroke="#e3cf8a" stroke-width="2"/>
  <rect x="130" y="90" width="14" height="8" rx="2" fill="#c9b45c"/>
  <path d="M128 108 h18 M128 115 h18 M128 122 h10" stroke="#c9b45c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M120 132 q-4 6-10 4 q-4-2-2-6 l6-8z" fill="#f2c9a8"/>
  <!-- head -->
  <circle cx="100" cy="42" r="17" fill="#f2c9a8"/>
  <path d="M83 42 q0-20 17-20 q17 0 17 20 q-4-9-17-9 q-13 0-17 9z" fill="#5a4636"/>
  <circle cx="94" cy="44" r="1.8" fill="#2c1e1a"/><circle cx="106" cy="44" r="1.8" fill="#2c1e1a"/>
  <path d="M95 51 q5 4 10 0" fill="none" stroke="#2c1e1a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
{% endmacro %}

  <circle cx="146" cy="54" r="1.8" fill="#2c1e1a"/><circle cx="158" cy="54" r="1.8" fill="#2c1e1a"/>
  <path d="M147 61 q5 4 10 0" fill="none" stroke="#2c1e1a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
{% endmacro %}
